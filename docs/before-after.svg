<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Before and after X Learn</title><desc id="desc">Before: ask, agent ships, understanding is unchecked. After: work, recall, feedback, adapt. One optional question turns completed work into a learning opportunity.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#94a3b8"/></marker></defs>
<rect width="1120" height="440" rx="20" fill="#0f172a"/>
<g font-family="Arial, sans-serif">
<text x="40" y="49" fill="#f8fafc" font-size="25" font-weight="700">Same work. One extra loop.</text>
<rect x="30" y="79" width="510" height="281" rx="14" fill="#1e293b"/>
<rect x="560" y="79" width="530" height="281" rx="14" fill="#102e36"/>
<text x="53" y="118" fill="#cbd5e1" font-size="16" font-weight="700">BEFORE · DELIVERY ONLY</text>
<text x="583" y="118" fill="#5eead4" font-size="16" font-weight="700">AFTER · DELIVERY + RECALL</text>
<g fill="#334155"><rect x="53" y="150" width="110" height="60" rx="10"/><rect x="201" y="150" width="145" height="60" rx="10"/><rect x="384" y="150" width="130" height="60" rx="10"/></g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M164 180H193"/><path d="M347 180H376"/></g>
<g fill="#f8fafc" font-size="17" text-anchor="middle"><text x="108" y="186">Ask</text><text x="273" y="186">Agent ships</text><text x="449" y="186">Move on</text></g>
<text x="53" y="264" fill="#f8fafc" font-size="21">The task is done.</text><text x="53" y="298" fill="#cbd5e1" font-size="18">Understanding is still unchecked.</text>
<g fill="#164e63"><rect x="584" y="150" width="132" height="60" rx="10"/><rect x="764" y="150" width="132" height="60" rx="10"/><rect x="764" y="249" width="132" height="60" rx="10"/><rect x="584" y="249" width="132" height="60" rx="10"/></g>
<g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M717 180H755"/><path d="M830 212V239"/><path d="M762 279H726"/><path d="M650 247V220"/></g>
<g fill="#f8fafc" font-size="18" text-anchor="middle"><text x="650" y="186">Work</text><text x="830" y="186">Recall</text><text x="830" y="285">Feedback</text><text x="650" y="285">Adapt</text></g>
<g fill="#99f6e4" font-size="16"><text x="926" y="178">One question</text><text x="926" y="208">Your context</text><text x="926" y="238">Your harness</text><text x="926" y="268">Skip anytime</text></g>
<text x="40" y="405" fill="#cbd5e1" font-size="18">Not another course. A small check on the reasoning behind the work.</text>
</g></svg>
